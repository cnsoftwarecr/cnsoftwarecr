<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="CNSoftware: desarrollo web creativo y funcional."><title>CNSoftware | Desarrollo web</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="navbar"><div class="container nav-content"><a class="logo" href="index.html">CNSoftware</a><a class="nav-center-logo" href="#inicio" aria-label="Ir al inicio"><i class="fa-solid fa-laptop-code"></i></a><button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false"><i class="fa-solid fa-bars"></i></button><nav class="nav-links"><a href="#inicio">Inicio</a><a href="#proyectos">Proyectos</a><a href="#servicios">Servicios</a><a href="#contacto">Contacto</a><a href="programador.html">Programador</a></nav></div></header>
<main><section class="hero" id="inicio"><div class="container hero-content"><h1>CREAMOS IDEAS DIGITALES</h1><p>Sitios web con energía, personalidad y una experiencia impecable en cada pantalla.</p><a class="button" id="heroWhatsapp" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Hablemos por WhatsApp</a></div></section>
<div class="wave-divider wave-projects" aria-hidden="true"><svg viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,32 C180,105 370,110 540,58 C735,0 870,8 1040,57 C1205,104 1325,88 1440,35 L1440,120 L0,120 Z"></path></svg></div><section class="section section-projects" id="proyectos"><div class="container"><h2 class="section-title">PROYECTOS</h2><div class="cards-grid" id="projectsGrid"></div></div></section>
<div class="wave-divider wave-services" aria-hidden="true"><svg viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,32 C180,105 370,110 540,58 C735,0 870,8 1040,57 C1205,104 1325,88 1440,35 L1440,120 L0,120 Z"></path></svg></div><section class="section section-services" id="servicios"><div class="container"><h2 class="section-title">SERVICIOS</h2><div class="cards-grid" id="servicesGrid"></div></div></section>
<div class="wave-divider wave-contact" aria-hidden="true"><svg viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0,32 C180,105 370,110 540,58 C735,0 870,8 1040,57 C1205,104 1325,88 1440,35 L1440,120 L0,120 Z"></path></svg></div><section class="section section-contact" id="contacto"><div class="container"><h2 class="section-title">CONTACTO</h2><div class="contact-layout"><form class="contact-form" id="contactForm"><input required placeholder="Tu nombre" aria-label="Tu nombre"><input required type="email" placeholder="Tu correo" aria-label="Tu correo"><textarea required placeholder="Cuéntame sobre tu proyecto" aria-label="Tu mensaje"></textarea><button class="button" type="submit">Enviar mensaje</button></form><div class="contact-details"><p><i class="fa-solid fa-envelope"></i> <a id="contactEmail"></a></p><p><i class="fa-solid fa-phone"></i> <a id="contactPhone"></a></p><p><a class="button button-outline" id="contactWhatsapp" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Escribir por WhatsApp</a></p></div></div></div></section></main>
<footer class="footer"><div class="container"><div class="footer-social" id="socialLinks"></div><p>© <span id="year"></span> CNSoftware. Todos los derechos reservados.</p></div></footer>
<script src="data.js"></script><script>
const data=getCNSData(),social=[['facebook','fa-facebook-f'],['instagram','fa-instagram'],['linkedin','fa-linkedin-in'],['github','fa-github']];
document.getElementById('projectsGrid').innerHTML=data.projects.map(p=>`<article class="card"><img class="project-image" src="${p.image}" alt="${p.title}"><div class="card-body"><h3>${p.title}</h3><p>${p.description}</p></div></article>`).join('');
document.getElementById('servicesGrid').innerHTML=data.services.map(s=>`<article class="card service-card"><i class="${s.icon}"></i><div class="card-body"><h3>${s.title}</h3><p>${s.description}</p></div></article>`).join('');
document.getElementById('socialLinks').innerHTML=social.map(([name,icon])=>`<a href="${data.contact[name]}" target="_blank" rel="noopener" aria-label="${name}"><i class="fa-brands ${icon}"></i></a>`).join('');
['heroWhatsapp','contactWhatsapp'].forEach(id=>document.getElementById(id).href=data.contact.whatsapp);const email=document.getElementById('contactEmail'),phone=document.getElementById('contactPhone');email.href=`mailto:${data.contact.email}`;email.textContent=data.contact.email;phone.href=`tel:${data.contact.phone.replace(/\s/g,'')}`;phone.textContent=data.contact.phone;document.getElementById('year').textContent=new Date().getFullYear();
document.querySelector('.menu-toggle').addEventListener('click',e=>{const nav=document.querySelector('.nav-links');nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',nav.classList.contains('open'))});document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();alert('¡Gracias! Te responderemos pronto.');e.target.reset()});
</script></body></html>
