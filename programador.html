<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Programador | CNSoftware</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="style.css"></head><body><header class="navbar"><div class="container nav-content"><a class="logo" href="index.html">CNSoftware</a><a class="button button-outline" href="index.html">Volver al inicio</a></div></header><main class="section"><div class="container profile-layout"><img id="programmerPhoto" class="profile-photo" alt="Foto del programador"><div class="profile-copy"><h1 id="programmerName"></h1><p id="programmerBio"></p><h2>Habilidades</h2><ul class="skill-list" id="skillsList"></ul><h2>Experiencia</h2><p id="programmerExperience"></p><a id="programmerWhatsapp" class="button" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Contactar por WhatsApp</a></div></div></main><footer class="footer"><div class="container">© <span id="year"></span> CNSoftware.</div></footer><script src="data.js"></script><script>const data=getCNSData(),p=data.programmer;programmerPhoto.src=p.photo;programmerPhoto.alt=`Foto de ${p.name}`;programmerName.textContent=p.name;programmerBio.textContent=p.bio;programmerExperience.textContent=p.experience;skillsList.innerHTML=p.skills.split(',').map(s=>`<li>${s.trim()}</li>`).join('');programmerWhatsapp.href=data.contact.whatsapp;year.textContent=new Date().getFullYear();</script></body></html>
