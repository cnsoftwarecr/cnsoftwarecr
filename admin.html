<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administrador | CNSoftware</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="container admin-page"><section id="loginView" class="login-box"><h1>ACCESO ADMIN</h1><form class="admin-form" id="loginForm"><input id="username" required autocomplete="username" placeholder="Usuario"><input id="password" required type="password" autocomplete="current-password" placeholder="Contraseña"><p class="error" id="loginError"></p><button class="button">Iniciar sesión</button></form></section><section id="panelView" class="hidden"><div class="admin-head"><h1>PANEL CNSoftware</h1><button class="mini-button" id="logoutButton">Cerrar sesión</button></div><section class="admin-section"><h2>Editar proyectos</h2><div class="editor-list" id="projectsList"></div><form class="admin-form" id="projectForm"><input id="projectTitle" required placeholder="Título"><input id="projectImage" required placeholder="URL de imagen"><textarea id="projectDescription" required placeholder="Descripción"></textarea><button class="button">Guardar cambios</button></form></section><section class="admin-section"><h2>Editar servicios</h2><div class="editor-list" id="servicesList"></div><form class="admin-form" id="serviceForm"><input id="serviceTitle" required placeholder="Título"><input id="serviceIcon" required placeholder="Clase FontAwesome"><textarea id="serviceDescription" required placeholder="Descripción"></textarea><button class="button">Guardar cambios</button></form></section><section class="admin-section"><h2>Info del programador</h2><form class="admin-form" id="programmerForm"><input id="progName" required placeholder="Nombre"><input id="progPhoto" required placeholder="URL de foto"><textarea id="progBio" required placeholder="Biografía"></textarea><input id="progSkills" required placeholder="Habilidades separadas por comas"><textarea id="progExperience" required placeholder="Experiencia"></textarea><button class="button">Guardar cambios</button></form></section><section class="admin-section"><h2>Info de contacto</h2><form class="admin-form" id="contactForm"><input id="email" required type="email" placeholder="Email"><input id="phone" required placeholder="Teléfono"><input id="whatsapp" required placeholder="Link WhatsApp"><input id="facebook" required placeholder="Facebook"><input id="instagram" required placeholder="Instagram"><input id="linkedin" required placeholder="LinkedIn"><input id="github" required placeholder="GitHub"><button class="button">Guardar cambios</button></form></section></section></main><script src="data.js"></script><script>
let data=getCNSData(),projectIndex=null,serviceIndex=null;const $=id=>document.getElementById(id),persist=()=>{saveCNSData(data);alert('Cambios guardados')};
function actions(kind,i){return `<span class="editor-actions"><button class="mini-button" onclick="editItem('${kind}',${i})">Editar</button><button class="mini-button" onclick="removeItem('${kind}',${i})">Eliminar</button></span>`}
function render(){projectsList.innerHTML=data.projects.map((p,i)=>`<div class="editor-item"><span>${p.title}</span>${actions('project',i)}</div>`).join('');servicesList.innerHTML=data.services.map((s,i)=>`<div class="editor-item"><span>${s.title}</span>${actions('service',i)}</div>`).join('');const p=data.programmer,c=data.contact;progName.value=p.name;progPhoto.value=p.photo;progBio.value=p.bio;progSkills.value=p.skills;progExperience.value=p.experience;['email','phone','whatsapp','facebook','instagram','linkedin','github'].forEach(k=>$(k).value=c[k])}
window.editItem=(kind,i)=>{if(kind==='project'){const p=data.projects[i];projectIndex=i;projectTitle.value=p.title;projectImage.value=p.image;projectDescription.value=p.description}else{const s=data.services[i];serviceIndex=i;serviceTitle.value=s.title;serviceIcon.value=s.icon;serviceDescription.value=s.description}};
window.removeItem=(kind,i)=>{if(confirm('¿Eliminar este elemento?')){data[kind==='project'?'projects':'services'].splice(i,1);persist();render()}};
projectForm.onsubmit=e=>{e.preventDefault();const item={title:projectTitle.value,image:projectImage.value,description:projectDescription.value};projectIndex===null?data.projects.push(item):data.projects[projectIndex]=item;projectIndex=null;e.target.reset();persist();render()};
serviceForm.onsubmit=e=>{e.preventDefault();const item={title:serviceTitle.value,icon:serviceIcon.value,description:serviceDescription.value};serviceIndex===null?data.services.push(item):data.services[serviceIndex]=item;serviceIndex=null;e.target.reset();persist();render()};
programmerForm.onsubmit=e=>{e.preventDefault();data.programmer={name:progName.value,photo:progPhoto.value,bio:progBio.value,skills:progSkills.value,experience:progExperience.value};persist()};
contactForm.onsubmit=e=>{e.preventDefault();data.contact={email:email.value,phone:phone.value,whatsapp:whatsapp.value,facebook:facebook.value,instagram:instagram.value,linkedin:linkedin.value,github:github.value};persist()};
if(!localStorage.cnsoftwareCredentials)localStorage.cnsoftwareCredentials=JSON.stringify({username:'admin',password:'admin123'});
function show(){loginView.classList.add('hidden');panelView.classList.remove('hidden');render()}loginForm.onsubmit=e=>{e.preventDefault();const c=JSON.parse(localStorage.cnsoftwareCredentials);if(username.value===c.username&&password.value===c.password){localStorage.cnsoftwareSession='active';show()}else loginError.textContent='Usuario o contraseña incorrectos.'};logoutButton.onclick=()=>{localStorage.removeItem('cnsoftwareSession');panelView.classList.add('hidden');loginView.classList.remove('hidden')};if(localStorage.cnsoftwareSession==='active')show();
</script></body></html>
